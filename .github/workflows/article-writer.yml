name: SEO Article Writer

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: >
          Keywords to process, one per line.
          Format: keyword | website | audience | tone | length | notes
          Example: best crm for agencies | https://example.com | agency owners | authoritative | 1200
        required: true
        type: string
      research_only:
        description: "Run research only (skip article generation)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  write-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Write keyword lines to batch file
        run: |
          printf '%s\n' "${{ github.event.inputs.keywords }}" > /tmp/keywords.txt
          echo "--- Keyword batch ---"
          cat /tmp/keywords.txt

      - name: Run article writer pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.research_only }}" = "true" ]; then
            python scripts/write_article.py --research-only --batch /tmp/keywords.txt
          else
            python scripts/write_article.py --batch /tmp/keywords.txt
          fi

      - name: Commit generated articles and updated state
        if: ${{ github.event.inputs.research_only != 'true' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add articles/ state/
          git diff --staged --quiet || \
            git commit -m "chore: add generated SEO articles [skip ci]"
          git push

      - name: Upload articles as workflow artifact
        if: ${{ github.event.inputs.research_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: seo-articles-${{ github.run_number }}
          path: articles/
          if-no-files-found: warn
